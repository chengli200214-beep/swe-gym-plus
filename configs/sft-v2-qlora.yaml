base_model: Qwen/Qwen2.5-Coder-3B-Instruct
train_file: ../experiments/sft-v0/data/sft/train.jsonl
output_dir: ../experiments/sft-v0/checkpoints/qwen2.5-coder-3b-qlora-v2

# v2 uses the head+tail SFT truncation fix so final patch/test actions remain
# supervised when a trajectory exceeds the context window.
epochs: 3
learning_rate: 0.0001
per_device_batch_size: 1
gradient_accumulation_steps: 1
max_seq_len: 2048
gradient_checkpointing: true
load_in_4bit: true
bnb_quant_type: nf4
bnb_double_quant: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
seed: 42
logging_steps: 1
oom_ladder:
  - max_seq_len: 2048
    gradient_accumulation_steps: 1
