base_model: /mnt/workspace/models/Qwen2.5-Coder-0.5B-Instruct
train_file: ../experiments/sft-bootstrap/data/train-demo.jsonl
output_dir: ../experiments/sft-bootstrap/checkpoints/qwen2.5-coder-0.5b-lora

# One-step BF16 LoRA smoke run for AMD/ROCm. Replace train_file with exported
# independently passed SWE-Gym trajectories for a real SFT experiment.
epochs: 1
learning_rate: 0.0001
per_device_batch_size: 1
gradient_accumulation_steps: 1
max_seq_len: 512
gradient_checkpointing: false
load_in_4bit: false
bnb_quant_type: nf4
bnb_double_quant: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
seed: 42
logging_steps: 1
optim: adamw_torch
oom_ladder:
  - max_seq_len: 512
    gradient_accumulation_steps: 1
