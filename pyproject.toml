[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagentbench"
version = "0.1.0"
description = "A reliable Coding Agent harness and evaluation platform built on SWE-Gym"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["httpx>=0.27"]
dataset = ["datasets>=2.18", "pyyaml>=6.0"]
service = ["fastapi>=0.110", "uvicorn>=0.29"]
train = ["datasets>=2.18", "transformers>=4.45", "peft>=0.13", "trl>=0.11"]
dev = ["pytest>=8.0"]

[project.scripts]
codeagentbench = "codeagentbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
