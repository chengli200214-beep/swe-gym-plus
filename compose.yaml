services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeagentbench
      POSTGRES_USER: codeagentbench
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5433:5432"
    volumes:
      - codeagentbench-postgres:/var/lib/postgresql/data

volumes:
  codeagentbench-postgres:
