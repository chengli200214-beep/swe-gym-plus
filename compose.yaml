services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeagentbench
      POSTGRES_USER: codeagentbench
      POSTGRES_PASSWORD: ${CODEAGENTBENCH_POSTGRES_PASSWORD:?Set a local development database password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - codeagentbench-postgres:/var/lib/postgresql/data

volumes:
  codeagentbench-postgres:
