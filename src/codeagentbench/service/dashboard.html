<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeAgentBench 实验台</title>
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#182c32;background:#edf2f0}body{max-width:1120px;margin:auto;padding:36px 24px}h1{font-size:28px;margin:0}p{color:#52646b}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.badge{background:#d9e9e1;padding:6px 12px;border-radius:20px}section{background:white;border:1px solid #d2dfda;border-radius:12px;padding:22px;margin:18px 0}button,select,input{font:inherit;padding:8px 12px;border:1px solid #bdccc7;border-radius:6px}button{cursor:pointer;background:#145646;color:white}button.secondary{background:white;color:#145646}button:disabled{opacity:.5;cursor:default}label{display:inline-flex;flex-direction:column;font-size:13px;margin:0 10px 12px 0}input{width:90px}select{min-width:240px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #edf2ef}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:480px;overflow:auto;background:#142a30;color:#e4eeeb;padding:16px;border-radius:8px;font:13px/1.6 monospace}.error{color:#a13232}#message{min-height:24px}.tabs{display:flex;gap:8px;flex-wrap:wrap}code{font-size:12px}@media(max-width:760px){body{padding:18px 12px}header{display:block}.scroll{overflow-x:auto}table{min-width:650px}}</style>
<header><div><h1>CodeAgentBench 实验台</h1><p>任务队列 · 执行轨迹 · 独立评测</p></div><span class="badge" id="health">连接中</span></header>
<section><h2>提交任务</h2><form id="submit"><label>任务<select id="task" required></select></label><label>最大步数<input id="steps" type="number" min="1" max="64" value="12"></label><label>Token 预算<input id="tokens" type="number" min="1" max="200000" value="32000"></label><label>时间预算（秒）<input id="seconds" type="number" min="1" max="3600" value="600"></label><button type="submit">加入队列</button></form><div id="message" role="status" aria-live="polite"></div></section>
<section><h2>运行记录</h2><div class="scroll"><table><thead><tr><th>任务 / Run ID</th><th>状态</th><th>独立评测</th><th>Token</th><th>操作</th></tr></thead><tbody id="runs"></tbody></table></div><p id="empty">尚无运行记录。提交后由独立 worker 执行。</p></section>
<section><h2 id="detail">运行详情</h2><div class="tabs" id="tabs"><button class="secondary" data-kind="summary">摘要</button><button class="secondary" data-kind="events">轨迹</button><button class="secondary" data-kind="patch">补丁</button><button class="secondary" data-kind="checkpoint">检查点</button></div><pre id="artifact">选择一条运行记录查看。</pre></section>
<script>
let selected=null;const $=id=>document.getElementById(id);async function api(path,options){const r=await fetch(path,options);const data=await r.json();if(!r.ok)throw new Error(data.detail||r.statusText);return data}function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':''}function button(text,fn){const b=document.createElement('button');b.className='secondary';b.textContent=text;b.onclick=fn;return b}async function show(id,kind='summary'){selected=id;$('detail').textContent='运行 '+id.slice(0,12);const a=await api('/runs/'+id+'/artifacts/'+kind);$('artifact').textContent=a.content||'尚无此项产物。'}async function mutate(id,action){try{await api('/runs/'+id+'/'+action,{method:'POST'});message(action==='cancel'?'已请求取消':'已加入恢复队列');await refresh()}catch(e){message(e.message,true)}}async function refresh(){try{const rows=await api('/runs');$('runs').replaceChildren();$('empty').hidden=rows.length>0;for(const row of rows){const tr=document.createElement('tr');const name=document.createElement('td');name.append(document.createTextNode(row.task_id),document.createElement('br'));const small=document.createElement('code');small.textContent=row.run_id.slice(0,12);name.append(small);tr.append(name);for(const value of [row.status,row.summary?.evaluation?.verdict||'待评测',row.summary?.budget?.tokens??'—']){const td=document.createElement('td');td.textContent=value;tr.append(td)}const actions=document.createElement('td');actions.append(button('查看',()=>show(row.run_id)));if(['queued','running'].includes(row.status))actions.append(button('取消',()=>mutate(row.run_id,'cancel')));if(['cancelled','interrupted'].includes(row.status))actions.append(button('恢复',()=>mutate(row.run_id,'resume')));tr.append(actions);$('runs').append(tr)}}catch(e){message(e.message,true)}}$('submit').onsubmit=async e=>{e.preventDefault();try{const row=await api('/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:$('task').value,max_steps:Number($('steps').value),max_tokens:Number($('tokens').value),max_seconds:Number($('seconds').value)})});message('已提交 '+row.run_id.slice(0,12));await refresh();await show(row.run_id)}catch(err){message(err.message,true)}};$('tabs').onclick=e=>{if(selected&&e.target.dataset.kind)show(selected,e.target.dataset.kind).catch(err=>message(err.message,true))};(async()=>{try{const health=await api('/health');$('health').textContent='已连接 · '+health.database;for(const task of await api('/tasks')){const option=document.createElement('option');option.value=task.task_id;option.textContent=task.task_id;$('task').append(option)}await refresh();setInterval(refresh,3000)}catch(e){message(e.message,true)}})();
</script></html>
