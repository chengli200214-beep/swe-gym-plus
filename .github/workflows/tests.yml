name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cab_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: cab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cab_test -d cab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://cab_test:ephemeral-ci-only@127.0.0.1:5432/cab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev,service,postgres,api]' 'pyyaml>=6.0'
      - name: Run unit tests without API keys or GPU
        run: python -m pytest -q
